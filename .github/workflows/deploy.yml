# ──────────────────────────────────────────────────────────────
# CI/CD (DataOps) — Hyperflix
#
# En cada push / pull request a main, GitHub Actions:
#   1. 🧪 Corre las pruebas del código de procesamiento (pytest, sin nube).
#   2. 🔎 Valida la infraestructura (terraform fmt + validate, sin credenciales).
#   3. 📋 Ejecuta `terraform plan` contra MongoDB Atlas (si hay estado remoto).
#   4. 🚀 Despliega (`terraform apply`) solo en push a main y tras la
#      aprobación manual del environment "produccion".
#
# Los pasos 3-4 se activan solo cuando existe TF_STATE_BUCKET (estado de
# Terraform en S3) como SECRET del repositorio (o como variable). Sin él el
# pipeline hace CI completo (pasos 1-2) sin tocar la nube. Toda la
# configuración se lee de secrets (con variables y valores por defecto como
# respaldo). Paso a paso en Mongo/docs/cicd_dataops.md.
# ──────────────────────────────────────────────────────────────
name: CI/CD DataOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos despliegues a la vez sobre el mismo estado de Terraform
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.16.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ── 1. Pruebas del código Python ────────────────────────────
  pruebas-python:
    name: 🧪 Pruebas Python
    runs-on: ubuntu-latest
    env:
      # Aislado de la nube: Data Lake en disco temporal y DW apagado
      DATA_LAKE_BACKEND: local
      DW_BACKEND: none
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compilar todos los scripts (errores de sintaxis)
        run: python -m compileall -q config.py iac_setup.py Mongo

      - name: Ejecutar pruebas (pytest)
        run: python -m pytest --junitxml=reporte-pruebas.xml

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: reporte-pruebas.xml
          retention-days: 14

  # ── 2. Validación estática de la infraestructura ────────────
  terraform-validar:
    name: 🔎 Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (sin backend, sin credenciales)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  # ── ¿Está configurada la nube? ──────────────────────────────
  # GitHub no permite usar `secrets` en el `if:` de un job, así que este job
  # revisa si existe TF_STATE_BUCKET y deja la respuesta como output.
  nube-configurada:
    name: ☁️ ¿Nube configurada?
    runs-on: ubuntu-latest
    outputs:
      activo: ${{ steps.revisar.outputs.activo }}
    steps:
      - id: revisar
        env:
          BUCKET: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
        run: |
          if [ -n "$BUCKET" ]; then
            echo "activo=true" >> "$GITHUB_OUTPUT"
          else
            echo "activo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Falta el secret TF_STATE_BUCKET: se omiten terraform plan y el despliegue."
          fi

  # ── 3. Plan contra MongoDB Atlas ────────────────────────────
  terraform-plan:
    name: 📋 Terraform plan
    needs: [pruebas-python, terraform-validar, nube-configurada]
    if: needs.nube-configurada.outputs.activo == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env: &entorno-terraform
      # Proveedor MongoDB Atlas (secretos del repositorio)
      TF_VAR_org_id: ${{ secrets.ATLAS_ORG_ID }}
      TF_VAR_mongodbatlas_public_key: ${{ secrets.ATLAS_PUBLIC_KEY }}
      TF_VAR_mongodbatlas_private_key: ${{ secrets.ATLAS_PRIVATE_KEY }}
      TF_VAR_db_password: ${{ secrets.ATLAS_DB_PASSWORD }}
      # Nombres del proyecto/clúster (secret → variable → por defecto; deben coincidir con lo ya creado)
      TF_VAR_project_name: ${{ secrets.TF_PROJECT_NAME || vars.TF_PROJECT_NAME || 'Hyperflix-IaC' }}
      TF_VAR_cluster_name: ${{ secrets.TF_CLUSTER_NAME || vars.TF_CLUSTER_NAME || 'Cluster-IaC' }}
      TF_VAR_cluster_tier: ${{ secrets.TF_CLUSTER_TIER || vars.TF_CLUSTER_TIER || 'M0' }}
      TF_VAR_provider_region: ${{ secrets.TF_PROVIDER_REGION || vars.TF_PROVIDER_REGION || 'US_EAST_1' }}
      # Estado remoto en S3 (mismo bucket/credenciales AWS del Data Lake)
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-2' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ secrets.TF_STATE_KEY || vars.TF_STATE_KEY || 'hyperflix/terraform/terraform.tfstate' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # *_override.tf solo existe en CI: en el PC sigue el estado local de siempre
      - name: Configurar estado remoto (S3)
        run: |
          cat > backend_override.tf <<EOF
          terraform {
            backend "s3" {
              bucket       = "${TF_STATE_BUCKET}"
              key          = "${TF_STATE_KEY}"
              region       = "${AWS_REGION}"
              encrypt      = true
              use_lockfile = true
            }
          }
          EOF

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: |
          # -detailed-exitcode: 0 = sin cambios, 2 = hay cambios, 1 = error
          codigo=0
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan || codigo=$?
          if [ "$codigo" -eq 1 ]; then
            echo "::error::terraform plan falló"
            exit 1
          fi
          {
            echo "## 📋 Terraform plan (MongoDB Atlas)"
            if [ "$codigo" -eq 0 ]; then
              echo "✅ Sin cambios: la infraestructura en Atlas coincide con el código."
            else
              echo "⚠️ Hay cambios pendientes (se aplicarán en el job *Desplegar* tras la aprobación):"
            fi
            echo '```'
            terraform show -no-color tfplan | tail -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 4. Despliegue (solo main + aprobación manual) ───────────
  desplegar:
    name: 🚀 Desplegar infraestructura
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion
    defaults:
      run:
        working-directory: infra/terraform
    env: *entorno-terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configurar estado remoto (S3)
        run: |
          cat > backend_override.tf <<EOF
          terraform {
            backend "s3" {
              bucket       = "${TF_STATE_BUCKET}"
              key          = "${TF_STATE_KEY}"
              region       = "${AWS_REGION}"
              encrypt      = true
              use_lockfile = true
            }
          }
          EOF

      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: |
          terraform plan -no-color -lock-timeout=5m -out=tfplan
          terraform apply -no-color -lock-timeout=5m tfplan

      - name: Resumen del despliegue
        run: |
          {
            echo "## 🎉 Infraestructura desplegada"
            echo "| Output | Valor |"
            echo "|---|---|"
            echo "| Proyecto | $(terraform output -raw project_id) |"
            echo "| Clúster | $(terraform output -raw cluster_name) |"
            echo "| Tier | $(terraform output -raw cluster_tier) |"
          } >> "$GITHUB_STEP_SUMMARY"
